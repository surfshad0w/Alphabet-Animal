<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Parade 1–50</title>
  <link rel="stylesheet" href="numbers.css">
</head>
<body>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <main class="numbers-home" id="numbersHome">
    <header class="home-header">
      <a class="home-button" href="index.html">← ABC</a>
      <div class="title-group">
        <h1>🔢 Number Parade</h1>
        <p>Tap a number to explore!</p>
      </div>
      <button class="home-button sound-button" id="soundButton" type="button" aria-pressed="true">🔊 Sound</button>
    </header>

    <section class="progress-section" aria-live="polite">
      <div class="progress-label">
        <span id="progressText">⭐ 0 / 50 Numbers Explored</span>
        <button class="reset-button" id="resetProgress" type="button">Reset</button>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="number-grid" id="numberGrid" aria-label="Numbers 1 through 50"></section>
  </main>

  <section class="number-detail hidden" id="numberDetail" aria-live="polite">
    <div class="detail-topbar">
      <button class="detail-button" id="detailBack" type="button">← Back</button>
      <div class="detail-navigation">
        <button class="detail-button nav-button" id="detailPrevious" type="button" aria-label="Previous number">◀</button>
        <button class="detail-button nav-button" id="detailNext" type="button" aria-label="Next number">▶</button>
      </div>
    </div>

    <div class="detail-content">
      <div class="detail-number" id="detailNumber">1</div>
      <div class="detail-word" id="detailWord">one</div>
      <div class="quantity-card">
        <div class="quantity-groups" id="quantityGroups"></div>
        <div class="quantity-caption" id="quantityCaption"></div>
      </div>
      <button class="hear-button" id="hearNumber" type="button">🔊 Hear Again</button>
      <p class="back-hint">Use the arrows to visit the next number.</p>
    </div>
  </section>

  <div class="completion-overlay hidden" id="completionOverlay">
    <div class="completion-card">
      <div class="trophy">🏆</div>
      <h2>Number Superstar!</h2>
      <p>You explored all 50 numbers!</p>
      <button id="closeCompletion" type="button">Keep Exploring</button>
    </div>
  </div>

  <div class="sr-only" id="liveRegion" aria-live="polite"></div>
  <script src="numbers.js"></script>
</body>
</html>
